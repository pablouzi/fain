<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAIN 2026 - Postulación enviada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fainBlue: '#0052FF',
            fainDarkBlue: '#003BB8',
            fainMagenta: '#FF2A85',
            fainOrange: '#FF6B00',
            fainLime: '#AEEA00',
            fainYellow: '#FFD600',
            fainCoral: '#FF3D3D',
            fainDark: '#0A0F24'
          },
          fontFamily: {
            bubble: ['Fredoka', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif'],
            titan: ['Titan One', 'cursive']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Titan+One&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #0052FF 0%, #1d4ed8 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .pop-card {
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 20px;
      box-shadow: 8px 8px 0px #000000;
    }
    .pop-btn {
      border: 3px solid #000000;
      border-radius: 14px;
      font-weight: 800;
      box-shadow: 4px 4px 0px #000000;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10 text-slate-900">
  <div class="max-w-3xl w-full pop-card p-8 md:p-12 text-center">
    <div class="mb-6 flex justify-center">
      <div class="w-20 h-20 rounded-full bg-fainLime border-4 border-black flex items-center justify-center text-4xl shadow-[6px_6px_0px_#000000]">
        ✓
      </div>
    </div>

    <h1 class="font-titan text-4xl md:text-6xl text-black mb-4">¡POSTULACIÓN ENVIADA!</h1>
    <p class="text-lg md:text-2xl font-semibold text-slate-700 mb-8">
      Tu formulario fue enviado correctamente. Gracias por participar en FAIN 2026.
    </p>

    <a href="https://pablouzi.github.io/fain/" class="pop-btn inline-block bg-fainYellow text-black px-6 py-3 text-base md:text-lg hover:bg-fainLime">
      Volver al sitio
    </a>
  </div>
</body>
</html>
